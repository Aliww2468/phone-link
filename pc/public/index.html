<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhoneLink · 手机消息</title>
<style>
  :root{
    --bg:#0f1417; --panel:#161d21; --panel2:#1d262b; --line:#27343a;
    --fg:#e6edf0; --dim:#8ea3ad; --accent:#2dd4bf; --sms:#4ade80; --notif:#c084fc;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.6 "Microsoft YaHei UI","Segoe UI",system-ui,sans-serif}
  header{padding:16px 20px;background:var(--panel);border-bottom:1px solid var(--line);
         display:flex;flex-wrap:wrap;gap:16px;align-items:center;position:sticky;top:0;z-index:5}
  h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.5px}
  h1 span{color:var(--accent)}
  .stats{display:flex;gap:18px;color:var(--dim);font-size:13px;margin-left:auto}
  .stats b{color:var(--fg);font-weight:600}
  .wrap{max-width:1100px;margin:0 auto;padding:16px 20px 60px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  input,select{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
               padding:8px 12px;border-radius:8px;font-size:13px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  input[type=search]{flex:1;min-width:200px}
  a.btn{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
        padding:8px 12px;border-radius:8px;text-decoration:none;font-size:13px}
  a.btn:hover{border-color:var(--accent);color:var(--accent)}
  .msg{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);
       border-radius:10px;padding:10px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
  .msg.sms{border-left-color:var(--sms)}
  .msg.notif{border-left-color:var(--notif)}
  .msg .time{color:var(--dim);font-size:12px;white-space:nowrap;padding-top:2px;min-width:118px;
             font-variant-numeric:tabular-nums}
  .msg .src{font-size:12px;font-weight:600;white-space:nowrap;padding-top:2px;min-width:110px;overflow:hidden;
            text-overflow:ellipsis}
  .msg.sms .src{color:var(--sms)}
  .msg.notif .src{color:var(--notif)}
  .msg .body{flex:1;min-width:0;word-break:break-word}
  .msg .who{font-weight:600;margin-right:6px}
  .msg .txt{white-space:pre-wrap}
  .empty{text-align:center;color:var(--dim);padding:60px 20px}
  .devices{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .dev{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
       padding:6px 12px;font-size:12px;color:var(--dim)}
  .dev b{color:var(--fg)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4b5563;margin-right:6px}
  .dot.on{background:var(--accent);box-shadow:0 0 6px var(--accent)}
  .toastbar{position:fixed;right:18px;bottom:18px;background:var(--panel2);border:1px solid var(--accent);
            color:var(--fg);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .3s;
            pointer-events:none;font-size:13px;max-width:380px}
  .toastbar.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>Phone<span>Link</span> · 手机消息</h1>
  <div class="stats">
    <div>今日 <b id="s-today">–</b></div>
    <div>总计 <b id="s-total">–</b></div>
    <div><span class="dot" id="s-dot"></span><b id="s-live">连接中…</b></div>
  </div>
</header>

<div class="wrap">
  <div class="devices" id="devices"></div>

  <div class="bar">
    <input type="search" id="q" placeholder="搜索内容 / 号码 / 应用…">
    <select id="kind">
      <option value="">全部类型</option>
      <option value="sms">仅短信</option>
      <option value="notif">仅通知</option>
    </select>
    <select id="app"><option value="">全部应用</option></select>
    <a class="btn" id="reload" href="#">刷新</a>
    <a class="btn" href="/api/export">导出全部</a>
  </div>

  <div id="list"><div class="empty">正在加载…</div></div>
</div>

<div class="toastbar" id="toastbar"></div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const list = $('list');
  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  let lastTopId = null;

  function fmtTime(ts) {
    const d = new Date(Number(ts) || Date.now());
    const p = (n) => String(n).padStart(2, '0');
    const today = new Date();
    const sameDay = d.toDateString() === today.toDateString();
    const date = sameDay ? '' : `${d.getMonth() + 1}/${d.getDate()} `;
    return date + `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }

  function render(m) {
    const kind = m.kind === 'sms' ? 'sms' : 'notif';
    const src = kind === 'sms' ? ('短信 ' + (m.sender || '')) : (m.app || m.pkg || '通知');
    const who = kind === 'sms' ? '' : (m.title || '');
    return `<div class="msg ${kind}" data-id="${esc(m.id)}">
      <div class="time">${esc(fmtTime(m.ts))}</div>
      <div class="src" title="${esc(src)}">${esc(src)}</div>
      <div class="body">${who ? `<span class="who">${esc(who)}</span>` : ''}<span class="txt">${esc(m.text || '')}</span></div>
    </div>`;
  }

  function showToast(text) {
    const t = $('toastbar');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove('show'), 4000);
  }

  async function load() {
    const params = new URLSearchParams();
    params.set('limit', '300');
    const q = $('q').value.trim(); if (q) params.set('q', q);
    if ($('kind').value) params.set('kind', $('kind').value);
    if ($('app').value) params.set('app', $('app').value);
    const r = await fetch('/api/history?' + params.toString());
    const d = await r.json();
    const msgs = d.messages || [];
    list.innerHTML = msgs.length
      ? msgs.map(render).join('')
      : '<div class="empty">还没有消息。<br>手机端开启同步后，新消息会自动出现在这里。</div>';
    lastTopId = msgs.length ? msgs[0].id : null;
  }

  async function loadStatus() {
    try {
      const d = await (await fetch('/api/status')).json();
      $('s-total').textContent = d.total;
      $('s-today').textContent = d.today;

      const sel = $('app');
      const cur = sel.value;
      sel.innerHTML = '<option value="">全部应用</option>' +
        (d.apps || []).filter(a => a.app).map(a =>
          `<option value="${esc(a.app)}">${esc(a.app)} (${a.n})</option>`).join('');
      sel.value = cur;

      const now = Date.now();
      $('devices').innerHTML = (d.devices || []).map((v) => {
        const fresh = now - Number(v.lastSeen || 0) < 10 * 60 * 1000;
        const bat = (v.battery >= 0) ? `${v.battery}%` : '?';
        return `<div class="dev"><span class="dot ${fresh ? 'on' : ''}"></span>` +
               `<b>${esc(v.name)}</b> · 电量 ${bat} · 待发 ${v.queued ?? 0} · ${esc(fmtTime(v.lastSeen))}</div>`;
      }).join('');
    } catch (e) { /* ignore */ }
  }

  function connect() {
    const es = new EventSource('/api/stream');
    es.onopen = () => { $('s-dot').classList.add('on'); $('s-live').textContent = '实时连接'; };
    es.onerror = () => { $('s-dot').classList.remove('on'); $('s-live').textContent = '重连中…'; };
    es.onmessage = (ev) => {
      let d;
      try { d = JSON.parse(ev.data); } catch { return; }
      if (d.type === 'message') {
        if ($('q').value.trim() || $('kind').value || $('app').value) { load(); loadStatus(); return; }
        const empty = list.querySelector('.empty');
        if (empty) list.innerHTML = '';
        list.insertAdjacentHTML('afterbegin', render(d.message));
        showToast('新消息：' + (d.message.app || d.message.sender || '') + ' ' +
                  String(d.message.text || '').slice(0, 60));
        loadStatus();
      } else if (d.type === 'heartbeat') {
        loadStatus();
      }
    };
  }

  $('reload').addEventListener('click', (e) => { e.preventDefault(); load(); loadStatus(); });
  let timer = null;
  const debounce = () => { clearTimeout(timer); timer = setTimeout(() => { load(); loadStatus(); }, 250); };
  $('q').addEventListener('input', debounce);
  $('kind').addEventListener('change', debounce);
  $('app').addEventListener('change', debounce);

  load();
  loadStatus();
  connect();
  setInterval(loadStatus, 30000);
})();
</script>
</body>
</html>
